<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10152b">
  <title>PIXEL ADVENTURE</title>
  <style>
    :root { color-scheme: dark; background: #10152b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #20294a 0%, #10152b 72%);
      font-family: "Courier New", monospace;
    }
    canvas {
      display: block;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      box-shadow: 0 0 70px #050817aa;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="game" width="384" height="216" tabindex="0" aria-label="Pixel Adventure platform game"></canvas>
<script>
(() => {
  "use strict";
  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width, H = canvas.height, WORLD_W = 3720;
  const keys = new Set();
  const platforms = [
    {x:0,y:190,w:390,h:40}, {x:450,y:190,w:330,h:40},
    {x:850,y:190,w:390,h:40}, {x:1310,y:190,w:340,h:40},
    {x:1720,y:190,w:410,h:40}, {x:2200,y:190,w:360,h:40},
    {x:2630,y:190,w:350,h:40}, {x:3050,y:190,w:670,h:40},
    {x:118,y:157,w:74,h:9}, {x:246,y:132,w:70,h:9},
    {x:505,y:153,w:76,h:9}, {x:644,y:126,w:82,h:9},
    {x:904,y:151,w:70,h:9}, {x:1042,y:126,w:78,h:9},
    {x:1150,y:155,w:60,h:9}, {x:1370,y:149,w:88,h:9},
    {x:1520,y:123,w:82,h:9}, {x:1784,y:155,w:77,h:9},
    {x:1920,y:127,w:90,h:9}, {x:2050,y:151,w:56,h:9},
    {x:2250,y:150,w:86,h:9}, {x:2390,y:122,w:78,h:9},
    {x:2670,y:152,w:85,h:9}, {x:2800,y:126,w:92,h:9},
    {x:2910,y:151,w:54,h:9}, {x:3170,y:151,w:90,h:9},
    {x:3310,y:123,w:90,h:9}, {x:3460,y:149,w:86,h:9}
  ];
  const coinSpots = [
    [140,143],[268,118],[535,139],[680,112],[930,137],[1078,112],
    [1180,141],[1406,135],[1556,109],[1810,141],[1964,113],[2070,137],
    [2280,136],[2428,108],[2700,138],[2845,112],[2930,137],
    [3200,137],[3355,109],[3490,135],[3650,157]
  ];
  const coins = coinSpots.map(([x,y], i) => ({x,y,got:false,phase:i*.63}));
  const enemyStarts = [ [326,174], [708,174], [1014,174], [1458,174], [1830,174], [2008,174], [2480,174], [2740,174], [3380,174], [3590,174] ];
  const enemies = enemyStarts.map(([x,y],i) => ({x,y,home:x,vx:i%2?-.34:.34,alive:true,phase:i}));
  const particles = [];
  let state = "title", last = 0, time = 0, camera = 0, score = 0, deaths = 0;
  let checkpoint = 80, audio;
  const player = {x:80,y:165,w:12,h:17,vx:0,vy:0,grounded:false,face:1,coyote:0,jumpBuffer:0,invuln:0,anim:0};

  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function tone(freq=440,duration=.07,type="square",volume=.035) {
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const osc=audio.createOscillator(), gain=audio.createGain();
      osc.type=type; osc.frequency.setValueAtTime(freq,audio.currentTime);
      gain.gain.setValueAtTime(volume,audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
      osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime+duration);
    } catch (_) { /* Audio is an optional enhancement. */ }
  }
  function reset() {
    state="playing"; score=0; deaths=0; camera=0; checkpoint=80;
    coins.forEach(c=>c.got=false);
    enemies.forEach((e,i)=>{e.x=enemyStarts[i][0];e.y=enemyStarts[i][1];e.vx=i%2?-.34:.34;e.alive=true;});
    player.x=80; player.y=165; player.vx=0; player.vy=0; player.grounded=false; player.invuln=0;
    particles.length=0; canvas.focus();
  }
  function startOrRestart() {
    if(state==="title"||state==="won"||state==="lost") reset();
    else if(state==="paused") state="playing";
  }
  function overlaps(a,b) {
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }
  function puff(x,y,color,n=6) {
    for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.2-.3,life:20+Math.random()*14,color});
  }
  function update(dt) {
    time+=dt;
    if(state!=="playing") { updateParticles(dt); return; }
    const step=Math.min(dt/16.667,2);
    const left=keys.has("ArrowLeft")||keys.has("a")||keys.has("A");
    const right=keys.has("ArrowRight")||keys.has("d")||keys.has("D");
    const wantsJump=keys.has(" ")||keys.has("ArrowUp")||keys.has("w")||keys.has("W");
    if(keys.has("jumpPressed")) { player.jumpBuffer=8; keys.delete("jumpPressed"); }
    else player.jumpBuffer=Math.max(0,player.jumpBuffer-step);
    if(player.grounded) player.coyote=8; else player.coyote=Math.max(0,player.coyote-step);
    const direction=(right?1:0)-(left?1:0);
    if(direction) { player.vx+=direction*.48*step; player.face=direction; }
    else player.vx*=Math.pow(player.grounded?.72:.92,step);
    player.vx=clamp(player.vx,-2.25,2.25);
    if(player.jumpBuffer>0&&player.coyote>0) {
      player.vy=-5.15; player.grounded=false; player.coyote=0; player.jumpBuffer=0;
      tone(560,.09); puff(player.x+6,player.y+16,"#d4e6ff",4);
    }
    if(!wantsJump&&player.vy< -2.2) player.vy+=.19*step;
    player.vy=Math.min(player.vy+.24*step,5.4);
    player.x=clamp(player.x+player.vx*step,0,WORLD_W-player.w);
    const oldY=player.y; player.y+=player.vy*step; player.grounded=false;
    for(const p of platforms) {
      if(player.x+player.w>p.x&&player.x<p.x+p.w) {
        if(player.vy>=0&&oldY+player.h<=p.y&&player.y+player.h>=p.y) {
          player.y=p.y-player.h; player.vy=0; player.grounded=true;
        } else if(player.vy<0&&oldY>=p.y+p.h&&player.y<=p.y+p.h) {
          player.y=p.y+p.h; player.vy=0;
        }
      }
    }
    player.anim+=Math.abs(player.vx)*step*.22;
    if(player.invuln>0) player.invuln-=step;
    for(const c of coins) if(!c.got&&overlaps(player,{x:c.x-5,y:c.y-6,w:10,h:12})) {
      c.got=true; score++; tone(780+score*12,.075,"sine",.04); puff(c.x,c.y,"#ffe572",7);
    }
    for(const e of enemies) if(e.alive) {
      e.x+=e.vx*step;
      if(Math.abs(e.x-e.home)>28) e.vx*=-1;
      if(overlaps(player,{x:e.x,y:e.y,w:14,h:14})) {
        if(player.vy>0&&player.y+player.h<e.y+10) {
          e.alive=false; player.vy=-3.65; score+=2; tone(250,.11,"square"); puff(e.x+7,e.y+7,"#ff8b70",10);
        } else if(player.invuln<=0) {
          deaths++; tone(110,.17,"sawtooth",.025);
          if(deaths>=3) {state="lost";break;}
          player.x=checkpoint; player.y=160; player.vx=0; player.vy=0; player.invuln=100;
          puff(player.x+6,player.y+8,"#ff7186",10);
        }
      }
    }
    if(player.x>checkpoint+250) checkpoint=player.x;
    if(player.y>H+35) {
      deaths++; if(deaths>=3) state="lost";
      else {player.x=checkpoint;player.y=155;player.vx=0;player.vy=0;player.invuln=100;}
    }
    if(player.x>WORLD_W-82) {state="won";tone(660,.14);setTimeout(()=>tone(880,.24,"sine"),130);}
    const target=clamp(player.x-W*.38,0,WORLD_W-W);
    camera+=(target-camera)*Math.min(.13*step,1);
    updateParticles(step);
  }
  function updateParticles(step) {
    for(let i=particles.length-1;i>=0;i--) {
      const p=particles[i]; p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.09*step;p.life-=step;
      if(p.life<=0) particles.splice(i,1);
    }
  }
  function rect(x,y,w,h,color) {ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
  function text(str,x,y,size=8,color="#fff",align="left") {
    ctx.fillStyle=color;ctx.font=`bold ${size}px "Courier New", monospace`;ctx.textAlign=align;ctx.textBaseline="middle";
    ctx.fillText(str,Math.round(x),Math.round(y));
  }
  function drawBackground() {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#172344");sky.addColorStop(.72,"#425781");sky.addColorStop(1,"#e89c78");
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    rect(294-camera*.025,25,24,24,"#ffe7a5");rect(298-camera*.025,21,16,32,"#ffe7a5");
    for(let i=0;i<56;i++) {
      const x=((i*83-camera*.12)%(W+20)+W+20)%(W+20), y=(i*47%105)+7;
      const blink=(Math.sin(time*.002+i*7)+1)*.5;
      rect(x,y,blink>.72?2:1,blink>.72?2:1,`rgba(240,244,255,${.2+blink*.58})`);
    }
    for(let layer=0;layer<3;layer++) {
      const parallax=camera*(.11+layer*.1), base=132+layer*17;
      ctx.fillStyle=["#34466d","#293b5a","#23364e"][layer];
      ctx.beginPath();ctx.moveTo(0,H);
      for(let x=-70;x<=W+80;x+=70) {
        const ridge=base-14-Math.sin((x+parallax)*.022+layer)*14-Math.cos((x+parallax)*.009)*9;
        ctx.lineTo(x,ridge);ctx.lineTo(x+35,ridge+20);
      }
      ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    }
    for(let i=0;i<15;i++) {
      const x=((i*113-camera*.32)%(W+50)+W+50)%(W+50)-20, y=136+(i*29%46);
      rect(x,y,17,2,"#8191aa");rect(x+4,y-3,7,3,"#71839d");
    }
  }
  function drawTile(p) {
    const x=Math.round(p.x-camera), y=p.y;
    rect(x,y,p.w,p.h,"#54445e");rect(x,y+4,p.w,p.h-4,"#39374e");
    rect(x,y,p.w,3,"#78c475");rect(x,y+3,p.w,2,"#4e9b68");
    for(let tx=8;tx<p.w;tx+=16) {
      rect(x+tx,y+9,1,5,"#51465b");rect(x+tx+5,y+17,5,2,"#5b4a5a");
      rect(x+tx+2,y+26,2,3,"#494056");
    }
  }
  function drawCoin(c) {
    const x=Math.round(c.x-camera), bob=Math.sin(time*.005+c.phase)*1.6, y=Math.round(c.y+bob);
    const width=2+Math.floor((Math.sin(time*.006+c.phase)+1)*2.5);
    rect(x-width-1,y-5,width*2+2,10,"#c47b36");
    rect(x-width,y-6,width*2,10,"#ffdb62");rect(x-width+1,y-4,Math.max(1,width*2-2),6,"#fff0a0");
    rect(x-1,y-3,2,6,"#e6a846");
  }
  function drawPlayer() {
    const x=Math.round(player.x-camera),y=Math.round(player.y);
    if(player.invuln>0&&Math.floor(time/70)%2===0)return;
    const walk=player.grounded&&Math.abs(player.vx)>.2?Math.sin(player.anim)*2:0;
    rect(x+2,y+1,8,7,"#f2ad78");rect(x+1,y,9,4,"#e84f68");
    rect(x+2,y+7,8,2,"#bb6b69");
    if(player.face===1){rect(x+8,y+4,2,2,"#202640");rect(x+8,y+5,1,1,"#fff");}
    else {rect(x+2,y+4,2,2,"#202640");rect(x+2,y+5,1,1,"#fff");}
    rect(x+2,y+9,8,5,"#47a8ce");rect(x+4,y+10,4,2,"#ffe177");
    rect(x+2,y+14+walk,3,3,"#283858");rect(x+7,y+14-walk,3,3,"#283858");
    rect(x+1,y+16+walk,4,1,"#f2ad78");rect(x+7,y+16-walk,4,1,"#f2ad78");
  }
  function drawEnemy(e) {
    const x=Math.round(e.x-camera),y=Math.round(e.y),s=Math.sin(time*.006+e.phase)*1;
    rect(x+2,y+5+s,10,7,"#ed735e");rect(x+4,y+2+s,6,5,"#ff9870");
    rect(x+3,y+11+s,3,3,"#693c55");rect(x+10,y+11+s,3,3,"#693c55");
    rect(x+4,y+5+s,2,2,"#fff");rect(x+9,y+5+s,2,2,"#fff");
    rect(x+5,y+6+s,1,2,"#252542");rect(x+10,y+6+s,1,2,"#252542");
  }
  function drawWorld() {
    for(const p of platforms) if(p.x+p.w>camera-10&&p.x<camera+W+10) drawTile(p);
    for(const c of coins) if(!c.got&&c.x>camera-10&&c.x<camera+W+10) drawCoin(c);
    for(const e of enemies) if(e.alive&&e.x>camera-20&&e.x<camera+W+20) drawEnemy(e);
    const flagX=WORLD_W-85-camera;
    rect(flagX,141,3,49,"#f4e6bd");rect(flagX+3,143,19,12,"#e85b78");rect(flagX+3,155,14,3,"#ffdb62");
    rect(flagX-6,188,17,3,"#ffe6a4");
    rect(WORLD_W-34-camera,151,20,39,"#2c4561");rect(WORLD_W-29-camera,156,10,29,"#5fcca0");
    rect(WORLD_W-26-camera,160,3,3,"#d5ffe0");rect(WORLD_W-20-camera,160,3,3,"#d5ffe0");
    drawPlayer();
    for(const p of particles) rect(p.x-camera,p.y,2,2,p.color);
  }
  function drawHud() {
    rect(0,0,W,18,"#11172bdc");
    text("PIXEL ADVENTURE",8,9,8,"#fff0a8");
    text("◆ "+String(score).padStart(2,"0"),155,9,8,"#ffe572");
    text("♥".repeat(Math.max(0,3-deaths))+"♡".repeat(Math.min(3,deaths)),224,9,9,"#ff7186");
    const barX=276,barW=100;
    rect(barX,6,barW,5,"#30334c");rect(barX,6,barW*clamp(player.x/WORLD_W,0,1),5,"#78d3a5");
    rect(barX+barW*clamp(player.x/WORLD_W,0,1)-1,4,3,9,"#fff0a8");
    text("GOAL",barX,14,5,"#d3d8e8");
  }
  function overlay() {
    rect(0,18,W,H-18,"#10152b35");
    if(state==="title") {
      rect(34,32,316,148,"#151b32eF");rect(37,35,310,142,"#263456");
      rect(42,40,300,132,"#151b32");
      text("A TINY HERO'S BIG JOURNEY",W/2,58,7,"#8ee2c2","center");
      text("PIXEL",W/2,83,25,"#fff0a8","center");text("ADVENTURE",W/2,107,21,"#fff","center");
      text("RUN  •  JUMP  •  COLLECT  •  SURVIVE",W/2,129,7,"#aab9d9","center");
      rect(124,145,136,18,"#53b98e");rect(126,147,132,14,"#75d5a8");
      text("PRESS ENTER TO PLAY",W/2,154,8,"#14253a","center");
      text("ARROWS / A D  MOVE     SPACE / W  JUMP",W/2,170,6,"#c1cae1","center");
    } else if(state==="paused") {
      rect(105,75,174,62,"#151b32");rect(109,79,166,54,"#263456");
      text("PAUSED",W/2,96,16,"#fff0a8","center");text("PRESS ESC TO RESUME",W/2,117,7,"#fff","center");
    } else if(state==="won"||state==="lost") {
      rect(55,55,274,104,"#151b32");rect(59,59,266,96,"#263456");
      text(state==="won"?"LEVEL COMPLETE!":"TRY AGAIN",W/2,82,17,state==="won"?"#fff0a8":"#ff8c9a","center");
      text(state==="won"?`SCORE  ${score}     COINS  ${coins.filter(c=>c.got).length}/${coins.length}`:`YOU SCORED ${score} POINTS`,W/2,105,8,"#fff","center");
      text("PRESS ENTER TO PLAY AGAIN",W/2,132,7,"#8ee2c2","center");
    } else {
      text("ESC PAUSE    R RESTART",W-7,H-6,5,"#e4e8f3","right");
    }
  }
  function render() {
    drawBackground();
    if(state==="title") {drawWorld();drawHud();}
    else {drawWorld();drawHud();}
    overlay();
  }
  function frame(now) {
    const dt=Math.min(now-last,40)||16.667;last=now;
    update(dt);render();requestAnimationFrame(frame);
  }
  window.addEventListener("keydown",e=>{
    const key=e.key;
    if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(key)) e.preventDefault();
    if((key==="Enter"||key===" ")&&(state==="title"||state==="won"||state==="lost"||state==="paused")) {
      if(state==="paused") state="playing"; else startOrRestart();
      keys.delete(key);return;
    }
    if(key==="Escape"&&state==="playing") {state="paused";return;}
    if((key==="r"||key==="R")&&state!=="title") {reset();return;}
    if(!keys.has(key)&&(key===" "||key==="ArrowUp"||key==="w"||key==="W")) keys.add("jumpPressed");
    keys.add(key);
  });
  window.addEventListener("keyup",e=>keys.delete(e.key));
  window.addEventListener("blur",()=>{keys.clear();if(state==="playing")state="paused";});
  let touchX=0;
  canvas.addEventListener("pointerdown",e=>{
    canvas.focus();
    if(state==="title"||state==="won"||state==="lost"){startOrRestart();return;}
    if(state==="paused"){state="playing";return;}
    const bounds=canvas.getBoundingClientRect(),x=(e.clientX-bounds.left)/bounds.width*W;
    touchX=x;
    if(x<W*.36) keys.add("ArrowLeft");
    else if(x<W*.67) keys.add("ArrowRight");
    else {keys.add("jumpPressed");keys.add(" ");}
  });
  canvas.addEventListener("pointerup",()=>{
    keys.delete("ArrowLeft");keys.delete("ArrowRight");keys.delete(" ");
  });
  canvas.addEventListener("pointercancel",()=>{
    keys.delete("ArrowLeft");keys.delete("ArrowRight");keys.delete(" ");
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
